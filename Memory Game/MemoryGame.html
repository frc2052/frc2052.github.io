<!DOCTYPE html>
<html lang="en">
<div class="homepage-link">
    <!--<button onclick="window.location.href='/index.html';">Go Back</button>-->
    <a href="/" aria-label="Go to homepage">
        <img href="/" src="https://www.team2052.com/assets/images/logo/logo-sm.png" alt="Banner" />
    </a>
</div>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnightKrawler Game</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><img src="https://www.team2052.com/assets/images/logo/logo-sm.png" class="moveImageLeft"
                    alt="Card front">
                KnightKrawler Memory Match<img src="https://www.team2052.com/assets/images/logo/logo-sm.png"
                    class="moveImageRight" alt="Card front"></h1>
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Moves:</div>
                    <div class="stat-value" id="movesValue">0</div>
                </div>

                <div class="stat">
                    <div class="stat-label">Time:</div>
                    <div class="stat-value" id="timeValue">0:00</div>
                </div>

                <div class="stat">
                    <div class="stat-label">Matches:</div>
                    <div class="stat-value" id="matchesValue">0/5</div>
                </div>
            </div>
        </div>

        <div class="game-board" id="gameBoard"></div>
    </div>

    <div class="controls">
        <button class="btn" onclick="newGame()">
            <i class="fas fa-redo-alt"></i> New Game
        </button>
    </div>
    </div>

    <div class="modal" id="winModal">
        <div class="modal-content">
            <span class="highlight1">
                <h2><i class="fas fa-trophy"></i> Congratulations! <i class="fas fa-trophy"></i></h2>
                <p>You won the game!</p>
                <p>Moves: <span id="finalMoves"></span><br>Time: <span id="finalTime"></span></p>
            </span>
            <button class="btn" onclick="newGame()">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
